<!doctype html>
<meta charset="utf-8">
<title>Botters: space swarm sketch</title>
<!-- Feel sketch: swarms are cohorts (one centre + a count); particles are drawn, not simulated.
     Your swarms follow your gambits; grab any one swarm by hand. ?n=60000 sets the particle draw budget. -->
<style>
  html, body { margin: 0; background: #050507; color: #b8b8c4; font: 13px ui-monospace, monospace; overflow: hidden }
  canvas { position: fixed; left: 0; top: 0; cursor: crosshair }
  #hud { position: fixed; left: 14px; top: 10px; pointer-events: none; white-space: pre; line-height: 1.55 }
  #gam { position: fixed; right: 0; top: 0; bottom: 0; width: 400px; padding: 10px 14px; line-height: 1.5; background: #08080b; border-left: 1px solid #1c1c24; overflow: auto }
  #gam div { padding: 3px 6px; border-left: 2px solid #333; cursor: pointer; margin-bottom: 2px; background: rgba(10,10,14,.75) }
  #gam div.off { opacity: .35; text-decoration: line-through }
  #gam div.hot { border-left-color: #ff2e88 }
  #gam b { color: #fff } #gam i { color: #ff2e88; font-style: normal; float: right }
  .you { color: #ff2e88 } .foe { color: #5b8cff } .dim { color: #77778a }
  #end { position: fixed; inset: 0; display: none; place-items: center; font-size: 40px; color: #fff; pointer-events: none }
</style>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="gam"></div>
<div id="end"></div>
<script>
const q = new URLSearchParams(location.search)
const W = 1200, H = 700, TPS = 20, MATCH = 300 * TPS, BUDGET = +(q.get('n') || 60000), MAX_SWARMS = 40
const K = 0.0035 // square law: each tick a swarm loses K × enemy count
const COLS = [0xff882eff, 0xffff8c5b], CSS = ['#ff2e88', '#5b8cff'], WHITE = 0xffffffff
const rad = n => 4 + Math.sqrt(n) * 0.32
const spd = n => 1.5 - Math.min(1, n / 15000) * 0.9 // big swarms are slow
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
const nearest = (c, list, max = 1e9) => { let b = null, bd = max; for (const o of list) { const d = dist(c, o); if (d < bd) { bd = d; b = o } } return b }

const cv = document.getElementById('c'), g = cv.getContext('2d')
let k = 1, ox = 0, oy = 0
const fit = () => { const vw = innerWidth - 430; k = Math.min(vw / W, innerHeight / H); cv.width = W; cv.height = H; cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; ox = (vw - W * k) / 2; oy = (innerHeight - H * k) / 2; cv.style.left = ox + 'px'; cv.style.top = oy + 'px' }
fit(); onresize = fit
const img = g.createImageData(W, H), px = new Uint32Array(img.data.buffer)
const TN = 1 << 17, TA = new Float32Array(TN), TR = new Float32Array(TN), TW = new Float32Array(TN)
for (let i = 0; i < TN; i++) { TA[i] = Math.random() * 6.283; TR[i] = Math.sqrt(Math.random()); TW[i] = (Math.random() - 0.5) * 0.06 }

let planets, sw, tick, ended, sel, paused = false, nextId
const mine = s => sw.filter(o => o.s === s), foes = c => sw.filter(o => o.s !== c.s)
function add(s, x, y, n) { const c = { id: nextId++, s, x, y, n, tx: x, ty: y, manual: false, rule: -1, noMerge: 0, seed: (Math.random() * TN) | 0, eng: false, loss: 0 }; sw.push(c); return c }
const go = (c, t) => { if (!t || t.x === undefined) return false; c.tx = t.x; c.ty = t.y }

function makePlanets() {
  const ps = [{ x: 90, y: H / 2, r: 26, owner: 0, cap: 1 }, { x: W - 90, y: H / 2, r: 26, owner: 1, cap: -1 }]
  for (let tries = 0; ps.length < 28 && tries < 5000; tries++) { // mirror-symmetric map
    const x = 180 + Math.random() * (W / 2 - 210), y = 40 + Math.random() * (H - 80), r = 6 + Math.random() * 16
    if (ps.some(p => Math.hypot(p.x - x, p.y - y) < p.r + r + 50)) continue
    for (const mx of [x, W - x]) ps.push({ x: mx, y, r, owner: -1, cap: 0 })
  }
  for (const p of ps) { p.mass = p.m0 = p.r === 26 ? 15000 : p.r * p.r * 25; p.stock = 0 }
  return ps
}

// ---------- gambits: IF condition → action, first match wins, re-evaluated every 0.5 s ----------
const COND = {
  'a bigger enemy swarm is near': c => nearest(c, foes(c).filter(o => o.n > c.n * 1.2), 170),
  'one of our planets is attacked': c => nearest(c, planets.filter(p => p.owner === c.s && p.mass > 0 && nearest(p, foes(c), p.r + 70)), 500),
  'a weaker enemy swarm is near': c => nearest(c, foes(c).filter(o => o.n < c.n * 0.9), 230),
  'this swarm is small (< 400)': c => c.n < 400 && nearest(c, mine(c.s).filter(o => o !== c)),
  'this swarm is big (> 4000)': c => c.n > 4000,
  'a free planet exists': c => nearest(c, planets.filter(p => p.owner === -1 && p.mass > 0)),
  'an enemy planet exists': c => nearest(c, planets.filter(p => p.owner === 1 - c.s && p.mass > 0)),
  'always': () => true,
}
const ACT = {
  'retreat to the nearest friend': c => go(c, nearest(c, mine(c.s).filter(o => o !== c && o.n >= c.n * 0.5)) || planets[c.s]),
  'attack it': (c, it) => go(c, it),
  'defend it': (c, it) => go(c, it),
  'merge into it': (c, it) => go(c, it),
  'go capture it': (c, it) => go(c, it),
  'split in two': c => split(c, false),
  'hold position': c => go(c, c),
}
const GAMBITS = [
  [['a bigger enemy swarm is near', 'retreat to the nearest friend'], ['one of our planets is attacked', 'defend it'], ['a weaker enemy swarm is near', 'attack it'],
   ['this swarm is small (< 400)', 'merge into it'], ['this swarm is big (> 4000)', 'split in two'], ['a free planet exists', 'go capture it'], ['an enemy planet exists', 'go capture it']],
  [['a weaker enemy swarm is near', 'attack it'], ['a free planet exists', 'go capture it'], ['this swarm is small (< 400)', 'merge into it'], // house: greedy blob, never retreats or splits
   ['an enemy planet exists', 'go capture it'], ['always', 'hold position']],
].map(list => list.map(([cond, act]) => ({ if: cond, then: act, on: true })))

function think(c) {
  const G = GAMBITS[c.s]
  for (let i = 0; i < G.length; i++) {
    if (!G[i].on) continue
    const it = COND[G[i].if](c)
    if (it && ACT[G[i].then](c, it) !== false) { c.rule = i; return }
  }
  c.rule = -1
}
function split(c, manual) {
  if (mine(c.s).length >= MAX_SWARMS || c.n < 200) return false
  c.n /= 2
  const b = add(c.s, c.x + 4, c.y + 4, c.n)
  b.manual = c.manual = manual; c.noMerge = b.noMerge = tick + 80
  const t = planets.filter(p => p.mass > 0 && p.owner !== c.s).sort((p, o) => dist(c, p) - dist(c, o))
  go(b, t[1] || { x: c.x, y: c.y + 80 })
  return b
}

function reset() {
  planets = makePlanets(); sw = []; tick = 0; ended = null; sel = null; nextId = 0
  for (const s of [0, 1]) for (let i = -1; i <= 1; i++) add(s, planets[s].x + (s ? -45 : 45), H / 2 + i * 70, 3000)
  buildPanel()
}

function step() {
  tick++
  if (tick % 10 === 0) for (const c of sw) if (!c.manual) think(c)
  for (const c of sw) { const d = dist(c, { x: c.tx, y: c.ty }), v = Math.min(d, spd(c.n) * (c.eng ? 0.25 : 1)); if (d > 1) { c.x += (c.tx - c.x) / d * v; c.y += (c.ty - c.y) / d * v } }
  for (const c of sw) { c.eng = false; c.loss = 0 }
  for (let i = 0; i < sw.length; i++) for (let j = i + 1; j < sw.length; j++) {
    const a = sw[i], b = sw[j]
    if (a.s !== b.s && dist(a, b) < rad(a.n) + rad(b.n)) { a.loss += K * b.n; b.loss += K * a.n; a.eng = b.eng = true }
  }
  for (const c of sw) c.n -= c.loss
  for (let i = 0; i < sw.length; i++) for (let j = i + 1; j < sw.length; j++) { // overlapping friends merge
    const a = sw[i], b = sw[j]
    if (a.s === b.s && a.n > 0 && b.n > 0 && a.noMerge < tick && b.noMerge < tick && dist(a, b) < 0.5 * (rad(a.n) + rad(b.n))) {
      a.x = (a.x * a.n + b.x * b.n) / (a.n + b.n); a.y = (a.y * a.n + b.y * b.n) / (a.n + b.n); a.n += b.n; b.n = 0
      a.manual = a.manual || b.manual; if (sel === b) sel = a
    }
  }
  sw = sw.filter(c => c.n >= 1); if (sel && !sw.includes(sel)) sel = null
  for (const p of planets) {
    if (p.mass <= 0) continue
    const pres = [0, 0]
    for (const c of sw) if (dist(c, p) < p.r + rad(c.n)) pres[c.s] += c.n
    const rate = n => Math.sqrt(n) / (p.r * 300)
    if (pres[0] && !pres[1]) p.cap = Math.min(1, p.cap + rate(pres[0]))
    if (pres[1] && !pres[0]) p.cap = Math.max(-1, p.cap - rate(pres[1]))
    if (p.cap >= 1) p.owner = 0; else if (p.cap <= -1) p.owner = 1
    else if ((p.owner === 0 && p.cap <= 0) || (p.owner === 1 && p.cap >= 0)) p.owner = -1
    if (p.owner < 0) continue
    const made = Math.min(p.mass, p.r * 0.12); p.mass -= made; p.stock += made // owned planets are consumed into new particles
    if (p.stock >= 60 || p.mass <= 0) {
      const near = sw.find(c => c.s === p.owner && dist(c, p) < p.r + rad(c.n) + 10)
      if (near) near.n += p.stock
      else if (mine(p.owner).length < MAX_SWARMS) add(p.owner, p.x, p.y, p.stock)
      else nearest(p, mine(p.owner)).n += p.stock
      p.stock = 0
    }
  }
  const total = s => mine(s).reduce((a, c) => a + c.n, 0)
  const alive = s => mine(s).length || planets.some(p => p.owner === s && p.mass > 0)
  if (!alive(0) || !alive(1) || tick >= MATCH) ended = !alive(1) ? 'YOU WIN' : !alive(0) ? 'you lose' : total(0) > total(1) ? 'YOU WIN (more particles at 5:00)' : 'you lose (fewer particles at 5:00)'
}

function draw() {
  for (let i = 0; i < px.length; i++) px[i] = ((px[i] >>> 1) & 0x7f7f7f7f) | 0xff000000 // trails
  const total = sw.reduce((a, c) => a + c.n, 0), scale = Math.min(1, BUDGET / total), t = performance.now() * 0.06
  for (const c of sw) {
    const m = Math.ceil(c.n * scale), rr = rad(c.n), col = COLS[c.s]
    for (let i = 0; i < m; i++) {
      const j = (c.seed + i) & (TN - 1), a = TA[j] + t * TW[j], r = TR[j] * rr
      const x = (c.x + Math.cos(a) * r) | 0, y = (c.y + Math.sin(a) * r * 0.85) | 0
      if (x >= 0 && x < W && y >= 0 && y < H) px[y * W + x] = c.eng && (j & 3) === 0 && Math.random() < 0.5 ? WHITE : col
    }
  }
  g.putImageData(img, 0, 0)
  for (const p of planets) {
    const col = p.owner < 0 ? '#555' : CSS[p.owner], left = p.mass / p.m0
    g.globalAlpha = p.mass > 0 ? 1 : 0.25
    g.fillStyle = p.owner < 0 ? '#2a2a33' : col + '55'; g.beginPath(); g.arc(p.x, p.y, Math.max(1.5, p.r * Math.sqrt(left)), 0, 7); g.fill()
    g.strokeStyle = col; g.lineWidth = 1; g.setLineDash(p.mass > 0 ? [] : [2, 3]); g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.stroke(); g.setLineDash([])
    if (Math.abs(p.cap) < 1 && p.cap !== 0) { g.strokeStyle = CSS[p.cap > 0 ? 0 : 1]; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, p.r + 4, -1.57, -1.57 + Math.abs(p.cap) * 6.283); g.stroke() }
    g.globalAlpha = 1
  }
  for (const c of mine(0)) if (c.manual || c === sel) {
    g.strokeStyle = c === sel ? '#fff' : 'rgba(255,255,255,.4)'; g.lineWidth = 1
    g.beginPath(); g.arc(c.x, c.y, rad(c.n) + 5, 0, 7); g.stroke()
    g.setLineDash([3, 4]); g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(c.tx, c.ty); g.stroke(); g.setLineDash([])
  }
}

function buildPanel() {
  const el = document.getElementById('gam')
  el.innerHTML = '<b>your gambits</b> <span class="dim">(click or 1–7 to toggle · first match wins)</span>'
  GAMBITS[0].forEach((gb, i) => {
    const d = document.createElement('div')
    d.innerHTML = `<b>${i + 1}</b> IF ${gb.if} → ${gb.then} <i></i>`
    d.onclick = () => toggle(i); gb.el = d; el.append(d)
  })
  const h = document.createElement('p'); h.className = 'dim'
  h.innerHTML = 'house gambits: ' + GAMBITS[1].map(gb => `${gb.if} → ${gb.then}`).join(' · ')
  el.append(h)
}
const toggle = i => { const gb = GAMBITS[0][i]; if (gb) { gb.on = !gb.on; gb.el.classList.toggle('off', !gb.on) } }

function panel() {
  const tot = s => Math.round(mine(s).reduce((a, c) => a + c.n, 0)), own = s => planets.filter(p => p.owner === s && p.mass > 0).length
  const left = Math.max(0, Math.ceil((MATCH - tick) / TPS))
  document.getElementById('hud').innerHTML =
    `<b class="you">you ${tot(0).toLocaleString()}</b> · ${mine(0).length} swarms · ${own(0)} planets      <b class="foe">house ${tot(1).toLocaleString()}</b> · ${mine(1).length} swarms · ${own(1)} planets\n` +
    `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} left · more particles at 5:00 wins · planets are eaten into particles\n` +
    (sel ? `selected: ${Math.round(sel.n)} particles · ${sel.manual ? '<b>yours</b> (G gives it back to the gambits)' : 'on gambits'}\n` : '\n') +
    `<span class="dim">click a pink swarm to grab it · click/right-click to send it · S split it · G release it · Tab next swarm · Esc drop · space pause · R restart</span>`
  const counts = GAMBITS[0].map(() => 0); for (const c of mine(0)) if (!c.manual && c.rule >= 0) counts[c.rule]++
  GAMBITS[0].forEach((gb, i) => { gb.el.querySelector('i').textContent = counts[i] ? `${counts[i]} swarm${counts[i] > 1 ? 's' : ''}` : ''; gb.el.classList.toggle('hot', counts[i] > 0) })
  const end = document.getElementById('end'); end.style.display = ended ? 'grid' : 'none'; end.textContent = ended ? `${ended} · press R` : ''
}

const at = e => ({ x: (e.clientX - ox) / k, y: (e.clientY - oy) / k })
function click(e, right) {
  const p = at(e), hit = mine(0).find(c => dist(c, p) < rad(c.n) + 8)
  if (hit && !right) { sel = hit; return }
  if (sel) { sel.manual = true; go(sel, p) }
}
cv.onmousedown = e => click(e, e.button === 2)
oncontextmenu = e => e.preventDefault()
onkeydown = e => {
  const key = e.key.toLowerCase()
  if (key >= '1' && key <= '9') toggle(+key - 1)
  if (key === ' ') paused = !paused
  if (key === 'r') reset()
  if (key === 'escape') sel = null
  if (key === 'g' && sel) sel.manual = false
  if (key === 's' && sel) { sel.manual = true; split(sel, true) }
  if (key === 'tab') { e.preventDefault(); const m = mine(0); sel = m[(m.indexOf(sel) + 1) % m.length] || null }
}

reset()
let acc = 0, last = performance.now(), frame = 0
function loop(now) {
  acc += Math.min(200, now - last); last = now
  while (acc >= 1000 / TPS) { if (!paused && !ended) step(); acc -= 1000 / TPS }
  draw(); if (frame++ % 6 === 0) panel()
  requestAnimationFrame(loop)
}
requestAnimationFrame(loop)
</script>
