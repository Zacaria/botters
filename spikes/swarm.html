<!doctype html>
<meta charset="utf-8">
<title>Botters: swarm sketch</title>
<!-- Feel sketch only: does a massive particle swarm look and feel good to steer? Not the game. ?n=200000 to push it. -->
<style>
  html, body { margin: 0; background: #050507; color: #9a9aa6; font: 12px ui-monospace, monospace; overflow: hidden }
  canvas { display: block; margin: auto; image-rendering: pixelated; cursor: crosshair }
  #hud { position: fixed; left: 16px; top: 12px; pointer-events: none; white-space: pre; line-height: 1.5 }
  b.you { color: #ff2e88 } b.foe { color: #5b8cff }
</style>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
const N = +(new URLSearchParams(location.search).get('n') || 40000)
const W = 960, H = 560, CS = 6, GW = Math.ceil(W / CS), GH = Math.ceil(H / CS)
const DMG = 0.015, SPEED = 0.9, WIN = 300, HOLD_R = 45
const cv = document.getElementById('c'), g = cv.getContext('2d')
cv.width = W; cv.height = H
const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; cv.style.marginTop = (innerHeight - H * k) / 2 + 'px' }
fit(); onresize = fit
const img = g.createImageData(W, H), d8 = img.data, px = new Uint32Array(d8.buffer)
const COL = [0xff882eff, 0xffff8c5b], SPARK = 0xffffffff // ABGR: pink you, blue enemy
const stars = Array.from({ length: 1400 }, () => ((Math.random() * H) | 0) * W + ((Math.random() * W) | 0))
const POINTS = [{ x: W / 2, y: H * 0.17 }, { x: W / 2, y: H / 2 }, { x: W / 2, y: H * 0.83 }]

let x, y, hp, side, grp, tgt, score, owner, ended, sel = 3, frame = 0, paused = false, mouse = null, down = false
const cnt = [new Uint16Array(GW * GH), new Uint16Array(GW * GH)]
function reset() {
  x = new Float32Array(N); y = new Float32Array(N); hp = new Float32Array(N).fill(1); side = new Uint8Array(N); grp = new Uint8Array(N)
  for (let i = 0; i < N; i++) {
    side[i] = i < N / 2 ? 0 : 1; grp[i] = i % 3
    const r = Math.sqrt(Math.random()) * 55, a = Math.random() * 6.283
    x[i] = (side[i] ? W - 110 : 110) + Math.cos(a) * r; y[i] = H * (0.2 + 0.3 * grp[i]) + Math.sin(a) * r
  }
  tgt = [0, 1].map(s => [0, 1, 2].map(k => ({ x: s ? W - 110 : 110, y: H * (0.2 + 0.3 * k) })))
  score = [0, 0]; owner = [null, null, null]; ended = null
}
reset()

function step() {
  cnt[0].fill(0); cnt[1].fill(0)
  for (let i = 0; i < N; i++) if (hp[i] > 0) cnt[side[i]][((y[i] / CS) | 0) * GW + ((x[i] / CS) | 0)]++
  for (let i = 0; i < N; i++) {
    if (hp[i] <= 0) continue
    const s = side[i], cx = (x[i] / CS) | 0, cy = (y[i] / CS) | 0, c = cy * GW + cx, own = cnt[s], E = cnt[1 - s][c]
    if (E) hp[i] -= DMG * E / own[c] // square law: a cell's losses scale with enemy count
    const t = tgt[s][grp[i]], dx = t.x - x[i], dy = t.y - y[i], dist = Math.hypot(dx, dy) || 1
    let vx = dist > 3 ? dx / dist * SPEED : 0, vy = dist > 3 ? dy / dist * SPEED : 0
    const gx = (cx < GW - 1 ? own[c + 1] : 0) - (cx > 0 ? own[c - 1] : 0) // pressure: flow from crowded to empty cells
    const gy = (cy < GH - 1 ? own[c + GW] : 0) - (cy > 0 ? own[c - GW] : 0)
    vx -= Math.max(-1.2, Math.min(1.2, gx * 0.04)); vy -= Math.max(-1.2, Math.min(1.2, gy * 0.04))
    vx += (Math.random() - 0.5) * 0.7; vy += (Math.random() - 0.5) * 0.7
    if (E) { vx *= 0.25; vy *= 0.25 } // engaged units lock into a front
    x[i] = Math.min(W - 0.01, Math.max(0, x[i] + vx)); y[i] = Math.min(H - 0.01, Math.max(0, y[i] + vy))
  }
  if (frame % 15 === 0) { groups(); enemyBrain(); points() }
}

let G = [] // [side][grp] = { x, y, n }
function groups() {
  G = [0, 1].map(() => [0, 1, 2].map(() => ({ x: 0, y: 0, n: 0 })))
  for (let i = 0; i < N; i++) if (hp[i] > 0) { const q = G[side[i]][grp[i]]; q.x += x[i]; q.y += y[i]; q.n++ }
  for (const s of G) for (const q of s) if (q.n) { q.x /= q.n; q.y /= q.n }
}
function enemyBrain() { // house AI: hunt a weaker group, merge when a bigger one is near, else hold its lane
  for (let k = 0; k < 3; k++) {
    const me = G[1][k]; if (!me.n) continue
    const threat = G[0].find(q => q.n > me.n * 1.3 && Math.hypot(q.x - me.x, q.y - me.y) < 120)
    const prey = G[0].filter(q => q.n && q.n < me.n * 0.8).sort((a, b) => Math.hypot(a.x - me.x, a.y - me.y) - Math.hypot(b.x - me.x, b.y - me.y))[0]
    const big = [...G[1]].sort((a, b) => b.n - a.n)[0]
    tgt[1][k] = threat && big !== me ? { x: big.x, y: big.y } : prey ? { x: prey.x, y: prey.y } : POINTS[k]
  }
}
function points() {
  POINTS.forEach((p, k) => {
    const n = [0, 0]
    for (let i = 0; i < N; i += 4) if (hp[i] > 0 && Math.abs(x[i] - p.x) < HOLD_R && Math.abs(y[i] - p.y) < HOLD_R) n[side[i]]++
    owner[k] = n[0] > n[1] ? 0 : n[1] > n[0] ? 1 : owner[k]
  })
  for (const s of [0, 1]) if (owner.filter(o => o === s).length >= 2) score[s] += 0.25 // 2 of 3 points: +1 per second
  const alive = [0, 1].map(s => G[s].reduce((a, q) => a + q.n, 0))
  if (!ended && (score[0] >= WIN || score[1] >= WIN || !alive[0] || !alive[1])) ended = score[0] >= WIN || !alive[1] ? 'YOU WIN' : 'you lose'
}

function draw() {
  for (let k = 0; k < d8.length; k += 4) { d8[k] *= 0.55; d8[k + 1] *= 0.55; d8[k + 2] *= 0.55; d8[k + 3] = 255 } // trails
  for (const st of stars) px[st] |= 0xff2a2a2a
  for (let i = 0; i < N; i++) if (hp[i] > 0) {
    const c = ((y[i] / CS) | 0) * GW + ((x[i] / CS) | 0)
    px[((y[i]) | 0) * W + ((x[i]) | 0)] = cnt[1 - side[i]][c] && Math.random() < 0.35 ? SPARK : COL[side[i]]
  }
  g.putImageData(img, 0, 0)
  POINTS.forEach((p, k) => {
    g.strokeStyle = owner[k] === 0 ? '#ff2e88' : owner[k] === 1 ? '#5b8cff' : '#444'; g.lineWidth = 1; g.setLineDash([2, 4])
    g.strokeRect(p.x - HOLD_R, p.y - HOLD_R, HOLD_R * 2, HOLD_R * 2); g.setLineDash([])
    g.fillStyle = '#777'; g.fillText('ABC'[k], p.x - 3, p.y - HOLD_R - 6)
  })
  for (let k = 0; k < 3; k++) if ((sel === 3 || sel === k) && G[0]?.[k]?.n) {
    const q = G[0][k], t = tgt[0][k]
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.moveTo(q.x, q.y); g.lineTo(t.x, t.y); g.stroke()
    g.fillStyle = '#fff'; g.fillText(k + 1, q.x - 3, q.y + 4)
  }
}

let last = performance.now(), ms = 0
function loop() {
  const t0 = performance.now()
  if (!paused && !ended) { if (down && mouse) for (let k = 0; k < 3; k++) if (sel === 3 || sel === k) tgt[0][k] = { ...mouse }; step(); frame++ }
  draw()
  ms = ms * 0.9 + (performance.now() - t0) * 0.1
  const alive = G[0] ? [0, 1].map(s => G[s].map(q => q.n)) : [[0], [0]]
  document.getElementById('hud').innerHTML =
    `<b class="you">you ${alive[0].reduce((a, b) => a + b, 0).toLocaleString()}</b>  [${alive[0].join(' / ')}]   vs   <b class="foe">house ${alive[1].reduce((a, b) => a + b, 0).toLocaleString()}</b>  [${alive[1].join(' / ')}]\n` +
    `score ${score[0] | 0} – ${score[1] | 0}  (hold 2 of 3 points, first to ${WIN})   ${ended ? '<b>' + ended + '</b>  press R' : ''}\n` +
    `<span style="color:#555">1 2 3 select a swarm · A all · hold mouse to steer · space pause · R restart · ${ms.toFixed(1)} ms/frame · ?n=${N}</span>`
  requestAnimationFrame(loop)
}
const at = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H } }
cv.onmousedown = e => { down = true; mouse = at(e) }
onmouseup = () => { down = false }
cv.onmousemove = e => { mouse = at(e) }
onkeydown = e => {
  if ('123'.includes(e.key)) sel = +e.key - 1
  if (e.key.toLowerCase() === 'a') sel = 3
  if (e.key === ' ') paused = !paused
  if (e.key.toLowerCase() === 'r') reset()
}
groups(); loop()
</script>
