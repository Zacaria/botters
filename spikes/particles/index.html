<!doctype html><meta charset="utf-8"><title>Botters particles spike</title>
<style>body{margin:0;background:#07070c;color:#cfd;font:13px monospace}canvas{display:block;margin:auto;max-width:100vw;cursor:crosshair}#h{padding:6px 10px}</style>
<div id="h"></div><canvas id="c" width="1200" height="700"></canvas>
<script type="module">
import { createParticles, step, order, detach, count, ROLES, TPS } from './psim.js'
const c = document.getElementById('c'), g = c.getContext('2d'), img = g.createImageData(1200, 700), px = new Uint32Array(img.data.buffer)
const COL = [[[255, 120, 190], [255, 80, 150], [255, 200, 225]], [[110, 190, 255], [60, 140, 255], [200, 230, 255]]] // [side][runner, grunt, tank] shades; role is a shade, colour is the camp
const pack = ([r, gg, b]) => 0xff000000 | b << 16 | gg << 8 | r
const s = createParticles(+new URLSearchParams(location.search).get('seed') || 1, 3000, 6, true)
let sel = 0, paused = false, acc = 0, last = performance.now()
const mine = () => s.bats.filter(b => b.side === 0 && b.n)
c.addEventListener('click', e => { const r = c.getBoundingClientRect(); order(s, sel, (e.clientX - r.left) * 1200 / r.width, (e.clientY - r.top) * 700 / r.height) })
addEventListener('keydown', e => {
  const m = mine()
  if (e.key === 'Tab') { e.preventDefault(); sel = m[(m.findIndex(b => b.id === sel) + 1) % m.length]?.id ?? sel }
  if (/^[1-9]$/.test(e.key)) sel = m[+e.key - 1]?.id ?? sel
  if (e.key === 'd') { const n = detach(s, sel); if (n >= 0) sel = n }
  if (e.key === 'r') { const n = detach(s, sel, 'runner'); if (n >= 0) sel = n }
  if (e.key === 'f') s.flank = !s.flank
  if (e.key === ' ') paused = !paused
})
function draw() {
  px.fill(0xff0a0a10)
  for (let i = 0; i < s.N; i++) if (s.alive[i]) { const k = ((s.y[i] | 0) * 1200 + (s.x[i] | 0)); const p = pack(COL[s.side[i]][s.role[i]]); px[k] = p; px[k + 1] = p }
  g.putImageData(img, 0, 0)
  for (const b of s.bats) if (b.n && b.side === 0) { g.strokeStyle = b.id === sel ? '#fff' : 'rgba(255,255,255,.25)'; g.setLineDash(b.id === sel ? [] : [3, 4]); g.beginPath(); g.arc(b.cx, b.cy, 6 + Math.sqrt(b.n), 0, 7); g.stroke(); if (b.id === sel) { g.beginPath(); g.moveTo(b.cx, b.cy); g.lineTo(b.tx, b.ty); g.stroke() } }
  const [a, b] = count(s)
  document.getElementById('h').textContent = `pink ${a} · blue ${b} · battalion ${sel} (${s.bats[sel]?.n ?? 0}) · click: order · Tab/1-9: select · D: detach half · R: detach runners · F: runners flank ${s.flank ? 'ON' : 'off'} · space: pause · shade = role (light tank, mid grunt, bright runner)`
}
function frame(now) { acc += now - last; last = now; let n = 0; while (!paused && acc > 1000 / TPS && n++ < 3) { step(s); acc -= 1000 / TPS } if (acc > 200) acc = 0; draw(); requestAnimationFrame(frame) }
requestAnimationFrame(frame)
</script>
