<!doctype html><meta charset="utf-8"><title>Botters particles spike</title>
<style>body{margin:0;background:#07070c;color:#cfd;font:13px monospace}canvas{display:block;margin:auto;max-width:100vw;cursor:crosshair}#h{padding:6px 10px}</style>
<div id="h"></div><canvas id="c" width="1200" height="700"></canvas>
<script type="module">
import { createParticles, step, order, detach, flank, count, ROLES, TPS } from './psim.js'
const c = document.getElementById('c'), g = c.getContext('2d'), img = g.createImageData(1200, 700), px = new Uint32Array(img.data.buffer)
const COL = [[[255, 150, 205], [255, 80, 150], [255, 200, 225]], [[130, 200, 255], [60, 140, 255], [200, 230, 255]]] // [camp][runner, grunt, tank]
const pack = ([r, gg, b]) => 0xff000000 | b << 16 | gg << 8 | r
const s = createParticles(+new URLSearchParams(location.search).get('seed') || 1, 3000, 6, true)
let sel = 0, paused = false, acc = 0, last = performance.now(), look = 0
const LOOKS = ['shade', 'size (runner 1px, grunt 2px, tank 3px)', 'camp only', 'trails (runners streak)']
const mine = () => s.bats.filter(b => b.side === 0 && b.n)
const at = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * 1200 / r.width, (e.clientY - r.top) * 700 / r.height] }
c.addEventListener('click', e => { order(s, sel, ...at(e)) })
c.addEventListener('contextmenu', e => { e.preventDefault(); flank(s, sel) })
const cycle = d => { const m = mine(); if (m.length) sel = m[(m.findIndex(b => b.id === sel) + d + m.length) % m.length].id }
addEventListener('keydown', e => {
  const m = mine()
  if (e.key === 'Tab') { e.preventDefault(); cycle(e.shiftKey ? -1 : 1) }
  if (/^[1-9]$/.test(e.key)) sel = m[+e.key - 1]?.id ?? sel
  if (e.key === 'd') { const n = detach(s, sel); if (n >= 0) sel = n }
  if (e.key === 'r') { const n = detach(s, sel, 'runner'); if (n >= 0) sel = n }
  if (e.key === 'x') flank(s, sel)
  if (e.key === 'v') look = (look + 1) % LOOKS.length
  if (e.key === 'f') s.flank = !s.flank
  if (e.key === ' ') paused = !paused
})
function dot(k, p, w) { px[k] = p; if (w > 1) { px[k + 1] = p; px[k + 1200] = p; px[k + 1201] = p } if (w > 2) { px[k + 2] = p; px[k + 1202] = p; px[k + 2400] = p; px[k + 2401] = p; px[k + 2402] = p } }
function draw() {
  px.fill(0xff0a0a10)
  for (let i = 0; i < s.N; i++) if (s.alive[i]) {
    const x = Math.min(1197, s.x[i] | 0), y = Math.min(696, s.y[i] | 0), k = y * 1200 + x, role = s.role[i], camp = s.side[i], isSel = s.bat[i] === sel
    let col = look === 2 ? COL[camp][1] : COL[camp][role]; if (isSel) col = col.map(v => Math.min(255, v + 90))
    const p = pack(col)
    if (look === 0 || look === 2) dot(k, p, 2)
    else if (look === 1) dot(k, p, role === 0 ? 1 : role === 1 ? 2 : 3)
    else { dot(k, p, role === 2 ? 3 : 2); if (role === 0) for (let t = 1; t <= 5; t++) { const tx = (x - s.vx[i] * t * 2.5) | 0, ty = (y - s.vy[i] * t * 2.5) | 0; if (tx >= 0 && tx < 1198 && ty >= 0 && ty < 697) px[ty * 1200 + tx] = pack(col.map(v => v * (1 - t * 0.15))) } }
  }
  g.putImageData(img, 0, 0)
  g.setLineDash([])
  for (const b of s.bats) if (b.n && b.side === 0) {
    const on = b.id === sel, r = 14 + Math.sqrt(b.n) * 1.6 // soft zone round every battalion, bold round the selected one
    g.strokeStyle = on ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.28)'; g.lineWidth = on ? 1.5 : 1; g.setLineDash(on ? [] : [3, 5])
    g.beginPath(); g.arc(b.cx, b.cy, r, 0, 7); g.stroke()
    g.fillStyle = on ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.5)'; g.font = '11px monospace'; g.fillText(`${mine().indexOf(b) + 1}`, b.cx - 3, b.cy - r - 4)
    if (on) { g.setLineDash([2, 4]); g.beginPath(); g.moveTo(b.cx, b.cy); for (const w of b.via) g.lineTo(w.x, w.y); g.lineTo(b.tx, b.ty); g.stroke(); g.fillRect(b.tx - 3, b.ty - 3, 6, 6) }
  }
  const [a, b] = count(s)
  document.getElementById('h').textContent = `pink ${a} · blue ${b} · battalion ${mine().findIndex(q => q.id === sel) + 1} (${s.bats[sel]?.n ?? 0}) · click: move · right-click or X: flank round the enemy line · Tab / Shift+Tab / 1-9: select · D: detach half · R: detach runners · V: look = ${LOOKS[look]} · space: pause`
}
function frame(now) { acc += now - last; last = now; let n = 0; while (!paused && acc > 1000 / TPS && n++ < 3) { step(s); acc -= 1000 / TPS } if (acc > 200) acc = 0; draw(); requestAnimationFrame(frame) }
requestAnimationFrame(frame)
</script>
