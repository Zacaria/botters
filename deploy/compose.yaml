name: botters
services:
  game:
    build:
      context: ./source
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '2567'
      BOTTERS_NAMESPACE: production
      PLAYER_ORIGINS: https://botters.havesomecode.io,https://botters.vercel.app,https://play.botters.havesomecode.io
    expose: ['2567']
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2567/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt: ['no-new-privileges:true']
    depends_on:
      game: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }
volumes:
  caddy_data:
  caddy_config:
