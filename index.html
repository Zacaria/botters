<!doctype html>
<meta charset="utf-8">
<title>Botters</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px ui-monospace, monospace; display: flex; gap: 16px; padding: 16px }
  canvas { background: #1b1b1b; cursor: crosshair; image-rendering: pixelated }
  aside { width: 300px; display: flex; flex-direction: column; gap: 10px }
  button { font: inherit; padding: 8px; background: #222; color: #ddd; border: 1px solid #444; cursor: pointer; text-align: left }
  button:disabled { opacity: .4; cursor: default } button.armed { border-color: #ff0; color: #ff0 }
  .call { border: 2px solid #ff0; padding: 8px; background: #2a2a00; animation: pulse 1s infinite }
  @keyframes pulse { 50% { background: #444400 } }
  input { font: inherit; padding: 6px; background: #000; color: #ddd; border: 1px solid #444 }
  .blue { color: #4aa3ff } .red { color: #ff5a5a } small { color: #888 }
  #end { font-size: 22px; color: #ff0 }
</style>
<canvas id="c"></canvas>
<aside>
  <div id="hud">connecting…</div>
  <div id="calls"></div>
  <div id="abilities" style="display:flex;flex-direction:column;gap:6px"></div>
  <form id="say"><input id="msg" placeholder="order to your agent (Enter)" maxlength="140" style="width:100%"></form>
  <div id="toast" style="min-height:2.6em"></div>
  <small><b>W E R</b> (or click): fire overdrive / recall / reveal instantly.<br><b>Q</b> then click the map: strike there.<br><b>Right-click</b> the map: ping your agent. Type below: order your agent.<br>When your agent asks for help, a yellow card appears: click <b>do it</b>.</small>
  <div id="end"></div>
</aside>
<script>
const q = new URLSearchParams(location.search), token = q.get('t'), S = 24
const cv = document.getElementById('c'), g = cv.getContext('2d')
let map, v, calls = [], opp, armed = null, intent = '', pilot
const COL = { blue: '#4aa3ff', red: '#ff5a5a' }, SHAPE = { fast: '▲', tank: '■', ranged: '●', miner: '◆' }
const post = (path, body) => fetch(`${path}?token=${token}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json())
const es = new EventSource(`/stream?token=${token}`)
es.addEventListener('map', e => { map = JSON.parse(e.data); cv.width = map.W * S; cv.height = map.H * S })
es.onmessage = e => { ({ view: v, calls, opponent: opp, intent, pilot } = JSON.parse(e.data)); draw(); panel() }

function draw() {
  if (!map || !v) return
  const me = v.side, foe = me === 'blue' ? 'red' : 'blue'
  g.fillStyle = '#1b1b1b'; g.fillRect(0, 0, cv.width, cv.height)
  map.bush.forEach((b, i) => { if (b) { g.fillStyle = '#1f4a26'; g.fillRect((i % map.W) * S, Math.floor(i / map.W) * S, S, S) } })
  g.fillStyle = 'rgba(255,255,255,.035)' // what you can see
  for (const u of v.units) { g.beginPath(); g.arc(u.x * S, u.y * S, 6 * S, 0, 7); g.fill() }
  for (const n of map.nodes) { g.fillStyle = '#806a1a'; g.fillRect(n.x * S - 5, n.y * S - 5, 10, 10) }
  for (const [k, p] of Object.entries(v.points)) {
    g.strokeStyle = p.owner === 'you' ? COL[me] : p.owner === 'enemy' ? COL[foe] : '#777'; g.lineWidth = 3
    g.beginPath(); g.arc(p.x * S, p.y * S, 1.5 * S, 0, 7); g.stroke()
    g.fillStyle = '#aaa'; g.font = '12px monospace'; g.fillText(k, p.x * S - 4, p.y * S - 1.7 * S)
  }
  for (const k of v.strikes) { g.strokeStyle = k.by === 'you' ? '#ff0' : '#f80'; g.setLineDash([4, 4]); g.beginPath(); g.arc(k.x * S, k.y * S, 2 * S, 0, 7); g.stroke(); g.setLineDash([]) }
  for (const c of calls) if (c.x != null) { g.strokeStyle = '#ff0'; g.lineWidth = 2; g.strokeRect(c.x * S - 10, c.y * S - 10, 20, 20) }
  const unit = (u, side) => {
    g.fillStyle = COL[side]; g.globalAlpha = u.inBush ? 0.55 : 1
    g.font = `${u.type === 'tank' ? 20 : 16}px monospace`; g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillText(SHAPE[u.type], u.x * S, u.y * S)
    g.fillStyle = '#0f0'; g.fillRect(u.x * S - 8, u.y * S + 10, 16 * u.hp / u.maxHp, 2)
    g.globalAlpha = 1; g.textAlign = 'start'; g.textBaseline = 'alphabetic'
  }
  v.units.forEach(u => unit(u, me)); v.enemies.forEach(u => unit(u, foe))
  if (armed === 'strike' && mouse) { g.fillStyle = 'rgba(255,255,0,.18)'; g.strokeStyle = '#ff0'; g.lineWidth = 2; g.beginPath(); g.arc(mouse.x * S, mouse.y * S, 2 * S, 0, 7); g.fill(); g.stroke() }
  for (const p of pings) if (p.until > Date.now()) { g.strokeStyle = '#0ff'; g.lineWidth = 2; g.beginPath(); g.arc(p.x * S, p.y * S, S * (1 + (p.until - Date.now()) / 1500), 0, 7); g.stroke() }
}

function panel() {
  const me = v.side
  document.getElementById('hud').innerHTML = `<b class="${me}">you: ${me}</b> · ${v.secondsLeft}s left<br>score <b>${v.score.you}</b> – ${v.score.enemy} (to ${v.score.win})<br>resources ${v.resources} · units ${v.units.length} · enemies seen ${v.enemies.length}` +
    (map?.players ? `<br><small>${Object.entries(map.players).map(([s, p]) => `<span class="${s}">${p.name}</span> ${p.setup}`).join(' vs ')}</small>` : '') +
    (pilot ? `<br><small>your pilot ${pilot.ms} ms</small>` : '') + (opp ? `<small> · enemy pilot ${opp.ms} ms</small>` : '') +
    `<br><br>🤖 agent's order to the pilot:<br><i>${intent ? esc(intent) : '(none yet: following doctrine)'}</i>`
  const callsKey = JSON.stringify(calls) // rebuild only on change: rebuilding every frame swallowed clicks
  if (callsKey !== lastCalls) { lastCalls = callsKey; document.getElementById('calls').innerHTML = calls.map((c, i) => `<div class="call">🤖 your agent asks: <b>${c.ability}</b>${c.x != null ? ` at (${c.x},${c.y})` : ''}<br>${esc(c.message)}<br><button data-call="${i}">do it</button></div>`).join('') }
  document.querySelectorAll('[data-call]').forEach(b => { const c = calls[b.dataset.call], cd = v.abilities[c.ability]; b.disabled = !!cd; b.textContent = cd ? `do it (ready in ${cd}s)` : 'do it' })
  for (const [a, cd] of Object.entries(v.abilities)) {
    const b = buttons[a]; b.disabled = !!cd; b.className = armed === a ? 'armed' : ''
    b.textContent = `[${KEYS[a]}] ${a}${cd ? ` (${cd}s)` : armed === a ? ': click the map' : ''}`
  }
  if (v.ended) document.getElementById('end').textContent = v.ended.winner === me ? `YOU WON (${v.ended.reason})` : v.ended.winner ? `you lost (${v.ended.reason})` : 'draw'
}
const esc = s => s.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c])
const KEYS = { strike: 'Q', overdrive: 'W', recall: 'E', reveal: 'R' }
const HELP = { strike: 'area damage where you click, lands after 1 s', overdrive: 'all your units +50% speed for 5 s', recall: 'teleport your miners home', reveal: 'see the whole map for 3 s' }
let lastCalls = '', mouse = null
const buttons = Object.fromEntries(Object.keys(KEYS).map(a => {
  const b = document.createElement('button'); b.title = HELP[a]; b.onclick = () => arm(a)
  document.getElementById('abilities').append(b); return [a, b]
}))
const toast = (t, ok = true) => { const el = document.getElementById('toast'); el.textContent = t; el.style.color = ok ? '#8f8' : '#f88' }
const use = (body, label) => post('/input', body).then(r => toast(r.ok ? `✓ ${label}` : `✗ ${r.error}`, r.ok))
const arm = a => {
  if (!v || v.abilities[a]) return toast(`✗ ${a} not ready`, false)
  if (a === 'strike') { armed = armed === a ? null : a; toast(armed ? 'strike armed: click the map (Esc to cancel)' : 'strike cancelled') }
  else use({ ability: a }, `${a}: ${HELP[a]}`)
  if (v) panel()
}
window.fire = c => use({ ability: c.ability, x: c.x, y: c.y }, `${c.ability} (agent's call)`)
document.getElementById('calls').onclick = e => { const i = e.target.dataset?.call; if (i !== undefined) fire(calls[i]) }
onkeydown = e => {
  if (e.target.tagName === 'INPUT') return
  if (e.key === 'Escape') { armed = null; toast('cancelled') }
  const a = Object.keys(KEYS).find(k => KEYS[k] === e.key.toUpperCase()); if (a) arm(a)
}
cv.onmousemove = e => { mouse = at(e) }
cv.onmouseleave = () => { mouse = null }
const at = e => ({ x: Math.round(e.offsetX / S * 10) / 10, y: Math.round(e.offsetY / S * 10) / 10 })
cv.onclick = e => { if (armed) { use({ ability: armed, ...at(e) }, `strike at (${at(e).x},${at(e).y})`); armed = null } else toast('arm an ability first (Q/W/E/R), or right-click to ping your agent', false) }
cv.oncontextmenu = e => { e.preventDefault(); const p = at(e); post('/say', { text: 'ping', ...p }); pings.push({ ...p, until: Date.now() + 1500 }); toast(`ping sent to your agent at (${p.x},${p.y})`) }
const pings = []
document.getElementById('say').onsubmit = e => { e.preventDefault(); const m = document.getElementById('msg'); if (m.value) { post('/say', { text: m.value }); toast(`sent to your agent: ${m.value}`) } m.value = '' }
</script>
